<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211914"><title>霍格華茲｜人生模擬器</title>
<style>
:root{--gold:#d8b779;--cream:#f4e7cf;--panel:#211914ed}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17120f;color:var(--cream);font-family:Georgia,"Noto Serif TC",serif}button{font:inherit;color:inherit;cursor:pointer;border:1px solid #b9945d;background:#33251d;padding:9px 13px;border-radius:7px}button:hover:not(:disabled){background:#62472e}button:disabled{opacity:.4;cursor:not-allowed}
#game{height:100%;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#776047,#2b211b 65%,#17120f)}#scene{position:absolute;inset:0;overflow:hidden;background:#211914}#scene-art{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}#scene:not([data-location="library"]){background:radial-gradient(ellipse at 50% 30%,#927956,#59432f 50%,#211914 100%)}#scene:not([data-location="library"]):before{content:"";position:absolute;inset:0;background:linear-gradient(150deg,#8d765755,#2b2119aa),repeating-linear-gradient(90deg,transparent 0 12%,#d6bd8a12 12.2% 12.5%)}#scene:not([data-location="library"]):after{content:"";position:absolute;left:0;right:0;bottom:0;height:32%;background:linear-gradient(0deg,#17120fdd,transparent)}
#topbar{position:absolute;z-index:8;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}#brand,#clock{padding:10px 14px;background:#211914d9;border:1px solid #b9945d88;border-radius:8px;font-size:13px}#brand b{color:var(--gold)}#top-actions{display:flex;gap:7px}
#scene-header{position:absolute;top:75px;left:28px;z-index:4;text-shadow:0 2px 8px #000}#scene-title{font-size:clamp(25px,3vw,42px);color:#f3dfb9;margin:0;font-weight:500}#place-desc{font:14px/1.6 system-ui,sans-serif;max-width:440px;color:#f5e7d2}
#bottom{position:absolute;z-index:8;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;background:#211914e8;border:1px solid #b9945d88;border-radius:12px;white-space:nowrap}#message{position:absolute;z-index:6;left:50%;bottom:82px;transform:translateX(-50%);width:min(720px,92vw);padding:12px 17px;background:#211914e8;border:1px solid #b9945d;border-radius:8px;text-align:center;font:14px/1.6 system-ui,sans-serif}
#hotspots{position:absolute;inset:0;z-index:5;pointer-events:none}.hotspot{pointer-events:auto;position:absolute;transform:translate(-50%,-50%);background:#241a14e8;border:1px solid #e4c58c;color:#fff0d2;box-shadow:0 3px 14px #0009;font-size:13px;max-width:210px}
#target-card,.panel,#map-modal,#intro{position:absolute;z-index:12;background:var(--panel);border:1px solid var(--gold);border-radius:12px;box-shadow:0 15px 50px #000a;padding:18px}#target-card{left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,90vw)}#target-card h2,.panel h2,#map-modal h2{margin:0 0 7px;color:var(--gold);font-size:21px;font-weight:500}#target-card p,.panel p,#map-modal p{font:14px/1.7 system-ui,sans-serif;color:#e9d9c2}#target-actions{display:grid;gap:7px}#target-actions button{text-align:left}.panel{right:18px;top:76px;width:min(370px,calc(100vw - 36px));max-height:75vh;overflow:auto}#map-modal{left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,94vw);max-height:85vh;overflow:auto}#location-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}.location-option{display:flex;gap:12px;align-items:center;text-align:left;min-height:64px;background:#34271f}.location-option>span:first-child{font-size:24px;color:var(--gold)}.location-option small{display:block;color:#c9b28f;font-size:11px;margin-top:4px}.location-option.current{border-color:#f6dca8;background:#5a412b}.close{float:right;padding:3px 9px}[hidden]{display:none!important}
#intro{left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,92vw);text-align:center;padding:26px}#intro h1{font-weight:500;color:var(--gold);font-size:clamp(26px,4vw,40px)}#intro p{font:14px/1.8 system-ui,sans-serif;color:#e8d8c0}
@media(max-width:680px){#topbar{flex-wrap:wrap}#top-actions{gap:4px}#top-actions button{padding:8px;font-size:12px}#scene-header{top:105px;left:16px}#bottom{width:calc(100% - 20px);justify-content:center;gap:4px}#bottom button{flex:1;padding:9px 5px;font-size:12px}#message{bottom:76px;font-size:12px}#location-list{grid-template-columns:1fr}}
</style></head><body><main id="game"><div id="scene" data-location="library"><img id="scene-art" src="./assets/art-direction/霍格華茲圖書館奇遇-2.png" alt="圖書館探索場景"><div id="hotspots"></div></div>
<header id="topbar"><div id="brand"><b>✦ 霍格華茲</b>　人生模擬器</div><div id="clock">第 1 天　14:20</div><div id="top-actions"><button id="map-button">地圖／地點</button><button id="bag-button">背包 <span id="inventory-count">3</span></button><button id="quest-button">任務</button></div></header>
<section id="scene-header"><h1 id="scene-title">圖書館</h1><small id="place-floor"></small><p id="place-desc">高聳書架、閱讀桌與午後陽光。</p></section><div id="message" role="status">午後陽光落在書頁上。</div>
<nav id="bottom"><button id="save-button">儲存</button><button id="load-button">讀取</button></nav>
<section id="target-card" hidden><button class="close" id="close-target">✕</button><small id="target-kind">物件</small><h2 id="target-name">目標</h2><p id="target-desc"></p><div id="target-actions"></div></section>
<section id="map-modal" hidden><button class="close" id="close-map">✕</button><h2>霍格華茲・地點</h2><p>選擇要前往的區域。學院交誼廳需要先取得通行資格。</p><div id="location-list"></div></section>
<aside id="panel-bag" class="panel" hidden><button class="close close-panel">✕</button><h2>背包</h2><p id="inventory"></p></aside><aside id="panel-quest" class="panel" hidden><button class="close close-panel">✕</button><h2>任務紀錄</h2><p><b>圖書館裡的異樣</b>　<span id="quest-status">進行中</span></p><p id="quest-progress"></p></aside>
<section id="intro"><h1>霍格華茲人生模擬器</h1><p>你已經抵達霍格華茲。從圖書館開始探索，與人物交談、調查物件，並讓時間與事件隨你的行動推進。</p><p>這是遊戲本體的開發版本，不是提示詞產生器。</p><button id="enter">開始探索</button></section></main><script src="./game.js"></script></body></html>
