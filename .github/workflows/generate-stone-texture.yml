name: Generate stone floor texture
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/art/generate_stone_floor.py"
      - ".github/workflows/generate-stone-texture.yml"
permissions:
  contents: write
# 多個美術 workflow 同時推 main 會互相擋：排隊執行，推送前先 rebase。
concurrency:
  group: art-texture-commit
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: python tools/art/generate_stone_floor.py
      - name: Commit generated texture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/art/textures/stone-floor-warm.png
          git diff --cached --quiet || git commit -m "art: add warm seamless stone floor texture"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done; exit 1
