name: Generate stone wall texture
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/art/generate_stone_wall.py"
      - ".github/workflows/generate-stone-wall-texture.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: python tools/art/generate_stone_wall.py
      - name: Commit generated texture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/art/textures/stone-wall-warm.png
          git diff --cached --quiet || git commit -m "art: add warm seamless stone wall texture"
          git push
