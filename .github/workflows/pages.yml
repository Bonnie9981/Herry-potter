name: Hogwarts Portal - Validate & Deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hogwarts-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check required portal files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets/art-direction
          cp assets/art-direction/*.png docs/assets/art-direction/
          test -s docs/index.html
          test -s docs/玩家使用指南.md
          test -f docs/.nojekyll
          grep -q '霍格華茲人生模擬器' docs/index.html
          grep -q '霍格華茲圖書館奇遇-2.png' docs/index.html
          ! grep -q 'function makePrompt' docs/index.html
          test -s assets/art-direction/霍格華茲圖書館奇遇-2.png
          test -s assets/art-direction/霍格華茲圖書館的魔法探索-1.png
          test -s docs/assets/art-direction/霍格華茲圖書館奇遇-2.png
          test -s docs/assets/art-direction/霍格華茲圖書館的魔法探索-1.png
          echo "Game entry and art reference assets are present."

      - name: Check game JavaScript syntax and DOM contract
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/game.js
          node --check docs/js/npcs.js
          node --test tests/npcs.test.mjs
          python - <<'PY'
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  value = dict(attrs).get("id")
                  if value:
                      self.ids.add(value)

          html = Path("docs/index.html").read_text(encoding="utf-8")
          js = Path("docs/game.js").read_text(encoding="utf-8")
          parser = IDs()
          parser.feed(html)
          required = set(re.findall(r'\$\(["\']#([A-Za-z0-9_-]+)["\']\)', js))
          missing = sorted(required - parser.ids)
          if missing:
              raise SystemExit("Missing DOM ids: " + ", ".join(missing))
          print(f"JavaScript syntax passed; {len(required)} static DOM ids verified.")
          PY

      - name: Validate HTML structure
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path

          class PortalParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.errors = []
                  self.stack = []
                  self.void = {"area", "base", "br", "col", "embed", "hr", "img",
                               "input", "link", "meta", "param", "source", "track", "wbr"}

              def handle_starttag(self, tag, attrs):
                  if tag not in self.void:
                      self.stack.append(tag)

              def handle_endtag(self, tag):
                  if tag in self.void:
                      return
                  if tag not in self.stack:
                      self.errors.append(f"Unexpected closing tag: </{tag}>")
                  else:
                      while self.stack:
                          current = self.stack.pop()
                          if current == tag:
                              break

          source = Path("docs/index.html").read_text(encoding="utf-8")
          parser = PortalParser()
          parser.feed(source)
          parser.close()
          if parser.errors:
              raise SystemExit("\\n".join(parser.errors))
          if parser.stack:
              raise SystemExit("Unclosed tags: " + ", ".join(parser.stack))
          print("HTML parser check passed.")

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Package public assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets/art-direction
          cp assets/art-direction/*.png docs/assets/art-direction/
          test -s docs/game.js
          test -s docs/assets/art-direction/霍格華茲圖書館奇遇-2.png

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Wait until Pages artifact is visible to the Actions API
        uses: actions/github-script@v8
        with:
          script: |
            const runId = context.runId;
            for (let attempt = 1; attempt <= 15; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100
              });
              const artifact = data.artifacts.find(item =>
                item.name === "github-pages" && !item.expired
              );
              if (artifact) {
                core.info(`Pages artifact is visible (id=${artifact.id}, size=${artifact.size_in_bytes}).`);
                return;
              }
              core.info(`Pages artifact not visible yet (attempt ${attempt}/15).`);
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error("The uploaded github-pages artifact did not become visible in the Actions API within 30 seconds.");

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
